baseURL = "https://ajency.in/"
locale = "en"
title = "Ajency.in"

# Pretty URLs: /about/, /self-documenting-uat-agent/ (do not set uglyURLs).
# Hugo auto-generates /sitemap.xml and /index.xml (RSS).
enableInlineShortcodes = false
disableKinds = ["taxonomy", "term"]

# /llms.txt is generated (layouts/index.llms.txt), not a static file — it
# ranges the same page collection as the sitemap, so it can't fall out of step.
# Adding LLMS to home's outputs means HTML + RSS must be listed too, or they drop.
[outputs]
  home = ["HTML", "RSS", "LLMS"]

[outputFormats.LLMS]
  mediaType = "text/plain"   # built-in; suffix "txt" → /llms.txt
  baseName = "llms"
  isPlainText = true         # text template: no HTML escaping

[markup.goldmark.renderer]
  unsafe = true  # harmless here (content is .html, passed through verbatim)

[security]
  # Allow HTML content files (content/*.html) — our pages are hand-written HTML,
  # passed through verbatim. Default policy blocks text/html; re-enable markdown + html.
  allowContent = ['^text/markdown$', '^text/html$']

[params]
  ogImage = "https://ajency.in/og-image.png"
  ogImageAlt = "It was always about agency. — ajency.in"
